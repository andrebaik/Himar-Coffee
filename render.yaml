services:
  - type: web
    name: himar-coffee-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: AI_MOCK
        value: "false"
      - key: AI_SERVICE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: AI_TIMEOUT_MS
        value: "20000"
